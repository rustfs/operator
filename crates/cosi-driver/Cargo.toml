[package]
name = "rustfs-cosi-driver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rustfs-cosi-driver"
path = "src/main.rs"

[dependencies]
operator = { path = "../.." }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "fs", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "2.0.1", features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.26.1", features = ["v1_30"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
