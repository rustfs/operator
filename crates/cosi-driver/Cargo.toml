[package]
name = "cosi-driver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "RustFS Container Object Storage Interface (COSI) v1alpha1 driver"
publish = false

[[bin]]
name = "rustfs-cosi-driver"
path = "src/main.rs"

[dependencies]
hex = "0.4"
k8s-openapi = { version = "0.26.1", features = ["v1_30"] }
kube = { version = "2.0.1", features = ["client", "rustls-tls"] }
prost = "0.13"
rustfs-admin = { path = "../rustfs-admin" }
sha2 = "0.10"
snafu = { version = "0.8.9", features = ["futures"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "fs", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros"] }

[lints.rust]
unused_variables = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
