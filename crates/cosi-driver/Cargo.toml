[package]
name = "rustfs-cosi-driver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rustfs-cosi-driver"
path = "src/main.rs"

[dependencies]
rustfs-admin = { path = "../rustfs-admin" }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "fs", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "4.2.0", features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.26.1", features = ["v1_30"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
snafu = { version = "0.9.2", features = ["futures"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
tonic-build = "0.14"
protoc-bin-vendored = "3"
