# Copyright 2025 RustFS Team
# RBAC for RustFS Operator (used by the dev and e2e deployment flows)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustfs-operator
  namespace: rustfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustfs-operator
rules:
  - apiGroups: ["rustfs.com"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rustfs.com"]
    resources: ["tenants/status"]
    verbs: ["update", "patch"]
  # Required when deleting dependents whose ownerReference uses
  # blockOwnerDeletion=true.
  - apiGroups: ["rustfs.com"]
    resources: ["tenants/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Legacy Tenant workload RBAC watch/cleanup. Write verbs remain during the
  # security migration so an older binary can coexist during a rolling upgrade.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # STS/PolicyBinding authorization flow (PolicyBinding policy selection)
  - apiGroups: ["sts.rustfs.com"]
    resources: ["policybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["certificates.cert-manager.io"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Tenant Events SSE / discovery uses events.k8s.io/v1 (demo login often uses rustfs-operator token)
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustfs-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustfs-operator
subjects:
  - kind: ServiceAccount
    name: rustfs-operator
    namespace: rustfs-system
---
# STS auto TLS needs to create one Secret and replace it when a previously generated Secret
# becomes invalid, uses the legacy policy, or approaches expiry. Keep write access namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustfs-operator-sts-tls
  namespace: rustfs-system
rules:
  # Kubernetes cannot restrict create by resourceNames.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sts-tls"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustfs-operator-sts-tls
  namespace: rustfs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustfs-operator-sts-tls
subjects:
  - kind: ServiceAccount
    name: rustfs-operator
    namespace: rustfs-system
