{{- $consoleLoginAdmission := default dict .Values.console.loginAdmission -}}
{{- $openShift := default dict .Values.openshift -}}
{{- $openShiftEnabled := default false $openShift.enabled -}}
{{- $reservedConsoleEnv := dict
  "CONSOLE_LOGIN_ADMISSION_REQUESTS_PER_SECOND" "console.loginAdmission.requestsPerSecond"
  "CONSOLE_LOGIN_ADMISSION_BURST" "console.loginAdmission.burst"
  "CONSOLE_LOGIN_ADMISSION_MAX_IN_FLIGHT" "console.loginAdmission.maxInFlight"
  "CONSOLE_LOGIN_ADMISSION_BODY_LIMIT_BYTES" "console.loginAdmission.bodyLimitBytes"
  "CONSOLE_LOGIN_ADMISSION_TIMEOUT_SECONDS" "console.loginAdmission.timeoutSeconds"
-}}
{{- range $env := .Values.console.env }}
{{- if hasKey $reservedConsoleEnv $env.name -}}
{{- fail (printf "console.env must not set %s; use %s instead" $env.name (get $reservedConsoleEnv $env.name)) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.console.enabled (ne (toString .Values.console.replicas) "1") -}}
{{- fail "console.replicas must be 1 because Console sessions are stored in process" -}}
{{- end -}}
{{- if .Values.console.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustfs-operator.fullname" . }}-console
  namespace: {{ include "rustfs-operator.namespace" . }}
  labels:
    {{- include "rustfs-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "rustfs-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "rustfs-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
      annotations:
        # Force reload on secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/console-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "rustfs-operator.consoleServiceAccountName" . }}
      {{- with .Values.console.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $openShiftEnabled }}
      {{- with .Values.console.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          command: ["./operator", "console", "--port", "{{ .Values.console.port }}"]
          env:
            - name: RUST_LOG
              value: {{ .Values.console.logLevel | default "info" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustfs-operator.fullname" . }}-console-secret
                  key: jwt-secret
          {{- with $consoleLoginAdmission }}
            - name: CONSOLE_LOGIN_ADMISSION_REQUESTS_PER_SECOND
              value: {{ .requestsPerSecond | quote }}
            - name: CONSOLE_LOGIN_ADMISSION_BURST
              value: {{ .burst | quote }}
            - name: CONSOLE_LOGIN_ADMISSION_MAX_IN_FLIGHT
              value: {{ .maxInFlight | quote }}
            - name: CONSOLE_LOGIN_ADMISSION_BODY_LIMIT_BYTES
              value: {{ .bodyLimitBytes | quote }}
            - name: CONSOLE_LOGIN_ADMISSION_TIMEOUT_SECONDS
              value: {{ .timeoutSeconds | quote }}
          {{- end }}
            {{- with .Values.console.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if not $openShiftEnabled }}
          {{- with .Values.console.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
