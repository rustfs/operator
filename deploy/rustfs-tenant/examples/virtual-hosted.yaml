# Layer over examples/gateway.yaml. DNS and edge TLS must cover BOTH names.
# Requires a RustFS image supporting RUSTFS_SERVER_DOMAINS.
tenant:
  spec:
    env:
      - name: RUSTFS_SERVER_DOMAINS
        value: s3.example.com
httpRoute:
  api:
    hostnames: [s3.example.com, "*.s3.example.com"]
