# Values file for: helm upgrade --install rustfs deploy/rustfs-tenant -n rustfs-storage -f ...
ingress:
  api:
    enabled: true
    ingressClassName: traefik
    hosts: [s3.example.com]
    tls:
      - hosts: [s3.example.com]
        secretName: rustfs-edge-tls
  console:
    enabled: true
    ingressClassName: traefik
    hosts: [console.example.com]
    tls:
      - hosts: [console.example.com]
        secretName: rustfs-edge-tls
