# The existing Gateway owns the public certificate and HTTPS listener.
httpRoute:
  api:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway
        namespace: gateway-system
        sectionName: https
    hostnames: [s3.example.com]
  console:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway
        namespace: gateway-system
        sectionName: https
    hostnames: [console.example.com]
