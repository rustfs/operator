apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: rustfs-openshift
  namespace: rustfs-tenant
spec:
  # This must be an arbitrary-UID-compatible image. In particular, writable
  # image-layer directories such as /data and /logs must be owned by group 0
  # and grant the group the same permissions as the owner. Do not deploy this
  # example until such a RustFS image is available in your registry.
  image: registry.example.com/rustfs/rustfs:openshift-compatible
  pools:
    - name: pool-0
      servers: 4
      persistence:
        volumesPerServer: 2
        volumeClaimTemplate:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

      # Match the MinIO Operator OpenShift contract: explicit empty objects
      # delegate UID, GID, FSGroup, and container security settings to the
      # namespace SecurityContextConstraints (SCC).
      securityContext: {}
      containerSecurityContext: {}
