# Optional companion to httproute.yaml, NOT included in the default overlay.
# First configure Tenant.spec.tls (see chart examples/backend-tls.yaml).
# Both listeners use the Tenant TLS configuration. The CA ConfigMap must exist
# in rustfs-storage and contain ca.crt; the certificate must cover each hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: rustfs-api
  namespace: rustfs-storage
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: rustfs-io
  validation:
    hostname: rustfs-io.rustfs-storage.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: rustfs-backend-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: rustfs-console
  namespace: rustfs-storage
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: rustfs-console
  validation:
    hostname: rustfs-console.rustfs-storage.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: rustfs-backend-ca
